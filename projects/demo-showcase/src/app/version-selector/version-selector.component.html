<ng-container *ngIf="latestVersion$ | async as latest">
  <a class="nav-link dropdown-toggle text-white" role="button" data-bs-toggle="dropdown" aria-expanded="false">
    {{ latest }}
  </a>
  <ng-container *ngIf="versions$ | async as versionList">
    <ul class="dropdown-menu dropdown-menu-end">
        <!-- Use light theme -->
        <li>
          <a class="dropdown-item"  type="button" [href]="'/'+latest+ '/'">
                 Latest({{ latest }})  <i class="bi bi-box-arrow-up-right"></i>
            </a>
        </li>
        <div class="dropdown-divider"></div>
        <li *ngFor="let version of versionList; index as i; first as isFirst">
          <a class="dropdown-item" [class.fw-bold]="version == latest" type="button" [href]="'/'+version+ '/'">
                 {{ version }}  <i class="bi bi-box-arrow-up-right"></i>
            </a>
        </li>
    </ul>
  </ng-container>
</ng-container>
