  <a class="nav-link dropdown-toggle text-white" role="button" data-bs-toggle="dropdown" aria-expanded="false">
    {{ current }}
  </a>
    <ul class="dropdown-menu dropdown-menu-end">
        <!-- Use light theme -->
        <li>
          <a class="dropdown-item"  type="button" [href]="latest.url">
                 Latest({{ latest.name }})  <i class="bi bi-box-arrow-up-right"></i>
            </a>
        </li>
        <div class="dropdown-divider"></div>
        <li *ngFor="let version of versionList; index as i; first as isFirst">
          <a class="dropdown-item" [class.fw-bold]="version.name == latest.name" type="button" [href]="version.url">
                 {{ version.name }}  <i class="bi bi-box-arrow-up-right"></i>
            </a>
        </li>
    </ul>
